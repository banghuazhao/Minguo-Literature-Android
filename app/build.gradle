plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}

def releaseAdIds = [
        AdMobAppId: localProperties.getProperty('AdMobAppId')?.trim(),
        adBannerID: localProperties.getProperty('adBannerID')?.trim(),
        adInterstitialID: localProperties.getProperty('adInterstitialID')?.trim(),
        adAppOpenID: localProperties.getProperty('adAppOpenID')?.trim(),
        adRewardedID: localProperties.getProperty('adRewardedID')?.trim()
]

def validateReleaseConfig = tasks.register('validateReleaseConfig') {
    doLast {
        def publisherIds = [] as Set
        releaseAdIds.each { key, rawValue ->
            def value = rawValue?.trim()
            def pattern = key == 'AdMobAppId'
                    ? ~/^ca-app-pub-(\d{16})~\d{10}$/
                    : ~/^ca-app-pub-(\d{16})\/\d{10}$/
            def match = value == null ? null : (value =~ pattern)
            if (match == null || !match.matches() || match.group(1) == '3940256099942544') {
                throw new GradleException("Missing or invalid production ${key} in local.properties")
            }
            publisherIds.add(match.group(1))
        }
        if (publisherIds.size() != 1) {
            throw new GradleException('Release AdMob IDs must belong to the same publisher')
        }
        if (!hasKeystore || ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any {
            !keystoreProperties.getProperty(it)?.trim()
        } || !file(keystoreProperties.getProperty('storeFile')).isFile()) {
            throw new GradleException('Release keystore configuration is missing or incomplete')
        }
    }
}

android {
    namespace 'com.appsbay.minguoliteratural'
    compileSdk 37

    defaultConfig {
        applicationId 'com.appsbay.minguoliteratural'
        minSdk 23
        targetSdk 37
        versionCode 12
        versionName '1.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [AdMobAppId: 'ca-app-pub-3940256099942544~3347511713']
        buildConfigField 'String', 'CONSENT_TEST_GEOGRAPHY', '"NONE"'
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) signingConfig signingConfigs.release
            manifestPlaceholders = [AdMobAppId: releaseAdIds.AdMobAppId ?: 'MISSING_RELEASE_AdMobAppId']
            minifyEnabled true
            shrinkResources true
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue 'string', 'adBannerID', releaseAdIds.adBannerID ?: 'MISSING_RELEASE_adBannerID'
            resValue 'string', 'adInterstitialID', releaseAdIds.adInterstitialID ?: 'MISSING_RELEASE_adInterstitialID'
            resValue 'string', 'adAppOpenID', releaseAdIds.adAppOpenID ?: 'MISSING_RELEASE_adAppOpenID'
            resValue 'string', 'adRewardedID', releaseAdIds.adRewardedID ?: 'MISSING_RELEASE_adRewardedID'
        }
        debug {
            resValue 'string', 'adBannerID', 'ca-app-pub-3940256099942544/6300978111'
            resValue 'string', 'adInterstitialID', 'ca-app-pub-3940256099942544/1033173712'
            resValue 'string', 'adAppOpenID', 'ca-app-pub-3940256099942544/3419835294'
            resValue 'string', 'adRewardedID', 'ca-app-pub-3940256099942544/5224354917'
        }
        privacyUsQa {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'String', 'CONSENT_TEST_GEOGRAPHY', '"US"'
        }
        privacyEeaQa {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'String', 'CONSENT_TEST_GEOGRAPHY', '"EEA"'
        }
        privacyOtherQa {
            initWith release
            matchingFallbacks = ['release']
            buildConfigField 'String', 'CONSENT_TEST_GEOGRAPHY', '"OTHER"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
}

tasks.configureEach {
    if (name in ['preReleaseBuild', 'prePrivacyUsQaBuild',
                 'prePrivacyEeaQaBuild', 'prePrivacyOtherQaBuild']) {
        dependsOn validateReleaseConfig
    }
}

