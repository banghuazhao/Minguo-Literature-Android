plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader -> keystoreProperties.load(reader) }
}

def adMobAppId = localProperties.getProperty('AdMobAppId',
        'ca-app-pub-3940256099942544~3347511713')

android {
    namespace 'com.appsbay.minguoliteratural'
    compileSdk 37

    defaultConfig {
        applicationId 'com.appsbay.minguoliteratural'
        minSdk 23
        targetSdk 37
        versionCode 12
        versionName '1.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [AdMobAppId: adMobAppId]
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue 'string', 'adBannerID', localProperties['adBannerID'] ?: ''
            resValue 'string', 'adInterstitialID', localProperties['adInterstitialID'] ?: ''
            resValue 'string', 'adNativeID', localProperties['adNativeID'] ?: ''
            resValue 'string', 'adAppOpenID', localProperties['adAppOpenID'] ?: ''
            resValue 'string', 'adRewardedID', localProperties['adRewardedID'] ?: ''
        }
        debug {
            resValue 'string', 'adBannerID', 'ca-app-pub-3940256099942544/6300978111'
            resValue 'string', 'adInterstitialID', 'ca-app-pub-3940256099942544/1033173712'
            resValue 'string', 'adNativeID', 'ca-app-pub-3940256099942544/2247696110'
            resValue 'string', 'adAppOpenID', 'ca-app-pub-3940256099942544/3419835294'
            resValue 'string', 'adRewardedID', 'ca-app-pub-3940256099942544/5224354917'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        resValues true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation project(':shinebuttonlib')

    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.ads.mediation:facebook:6.22.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

apply from: 'catalog-validation.gradle'
